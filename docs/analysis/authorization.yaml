# Canonical authorization object — YAML mirror of `analysis.json`.
#
# Serialization is not allowed to change semantics: this file and the
# `authorization` / `authorization_grants` fields of analysis.json must
# deserialize to the same logical object (invariants SER-001…SER-012, checked
# by tools/validate-analysis.mjs). The body below is generated from the record.
#
# Field names are canonical. Do not introduce variants such as
# authorization_level, auth_level, permission_level, allowed_operations,
# authorized_operations or authorized_change_ids.
#
# Section 167: authorization.state ≠ authorization.level.profile ≠ capability
# ≠ operation ≠ scope ≠ change authorization. Sections 152/153:
# EffectiveCapabilities = (Capabilities(profile) ∩ allow) − deny, and deny wins.

authorization:
  state: GRANTED
  level:
    profile: DOC_REFACTOR
  capabilities:
    mode: RESTRICT
    allow:
      - REPOSITORY_READ
      - ANALYSIS_EXECUTE
      - PROPOSAL_CREATE
      - DOCUMENT_CREATE
      - DOCUMENT_MODIFY
      - DOCUMENT_RENAME
      - DOCUMENT_MOVE
    deny:
      - DOCUMENT_DELETE
  operations:
    allow:
      - READ
      - ANALYZE
      - PROPOSE
      - CREATE
      - MODIFY
      - RENAME
      - MOVE
    deny:
      - DELETE
  scope:
    paths:
      include:
        - README.md
        - docs/
        - tools/
        - prototype/
        - archive/
      exclude: []
