# Canonical authorization object — YAML mirror of `analysis.json`.
#
# Serialization is not allowed to change semantics: this file and the
# `authorization` / `authorization_grants` fields of analysis.json must
# deserialize to the same logical object (invariants SER-001…SER-012, checked by
# tools/validate-analysis.mjs). The body below is generated from the record.
#
# Field names are canonical. Do not introduce variants such as
# authorization_level, auth_level, permission_level, allowed_operations,
# authorized_operations or authorized_change_ids.
#
# Sections 177-179: state ≠ level.profile ≠ capability (an object with its own
# state and resource class) ≠ operation ≠ scope ≠ change authorization.
# EffectiveCapabilities = (ProfileCapabilities ∩ grants) − denies, deny wins.

