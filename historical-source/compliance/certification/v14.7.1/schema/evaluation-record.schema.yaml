{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7.1/evaluation-record.schema.yaml",
  "title": "evaluation-record",
  "type": "object",
  "required": [
    "evaluation_id",
    "subject_ref",
    "predicate_ref",
    "evaluator_id",
    "evaluator_version",
    "evaluator_hash",
    "lifecycle",
    "context_hash",
    "result_ref",
    "evaluated_at",
    "sequence_no",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "evaluation_id": {
      "type": "string",
      "minLength": 1
    },
    "subject_ref": {
      "type": "string",
      "minLength": 1
    },
    "predicate_ref": {
      "type": "string",
      "minLength": 1
    },
    "evaluator_id": {
      "type": "string",
      "minLength": 1
    },
    "evaluator_version": {
      "type": "string",
      "minLength": 1
    },
    "evaluator_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "lifecycle": {
      "type": "string",
      "enum": [
        "CREATED",
        "VALIDATING",
        "READY",
        "EVALUATING",
        "COMPLETED",
        "INVALID",
        "BLOCKED",
        "FAILED"
      ]
    },
    "context_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "result_ref": {
      "oneOf": [
        {
          "type": "string",
          "minLength": 1
        },
        {
          "type": "null"
        }
      ]
    },
    "evaluated_at": {
      "oneOf": [
        {
          "type": "string",
          "format": "date-time"
        },
        {
          "type": "null"
        }
      ]
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "evaluation_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "EXPLICIT_ONEOF_NULL_ONLY",
  "x-timestamp-semantics": "UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH",
  "x-version-relationship": "METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "lifecycle is not result",
    "terminal retry requires new evaluation"
  ]
}
