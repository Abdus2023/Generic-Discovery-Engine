{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7.1/verification-result.schema.yaml",
  "title": "verification-result",
  "type": "object",
  "required": [
    "verification_result_id",
    "verification_id",
    "result",
    "evaluation_refs",
    "evaluator_id",
    "evidence_refs",
    "evaluated_at",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "verification_result_id": {
      "type": "string",
      "minLength": 1
    },
    "verification_id": {
      "type": "string",
      "minLength": 1
    },
    "result": {
      "type": "string",
      "enum": [
        "PASS",
        "FAIL",
        "UNKNOWN",
        "BLOCKED",
        "INVALID"
      ]
    },
    "evaluation_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "evaluator_id": {
      "type": "string",
      "minLength": 1
    },
    "evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "verification_result_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "EXPLICIT_ONEOF_NULL_ONLY",
  "x-timestamp-semantics": "UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH",
  "x-version-relationship": "METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "result is separate from verification lifecycle and current status"
  ]
}
