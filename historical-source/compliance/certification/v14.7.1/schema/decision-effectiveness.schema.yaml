{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7.1/decision-effectiveness.schema.yaml",
  "title": "decision-effectiveness",
  "type": "object",
  "required": [
    "effectiveness_id",
    "decision_id",
    "status",
    "basis_hash",
    "evaluated_at",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "effectiveness_id": {
      "type": "string",
      "minLength": 1
    },
    "decision_id": {
      "type": "string",
      "minLength": 1
    },
    "status": {
      "type": "string",
      "enum": [
        "EFFECTIVE",
        "EXPIRED",
        "REVOKED",
        "SUPERSEDED",
        "INVALID",
        "UNKNOWN"
      ]
    },
    "basis_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "effectiveness_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "EXPLICIT_ONEOF_NULL_ONLY",
  "x-timestamp-semantics": "UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH",
  "x-version-relationship": "METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "does not mutate decision status"
  ]
}
