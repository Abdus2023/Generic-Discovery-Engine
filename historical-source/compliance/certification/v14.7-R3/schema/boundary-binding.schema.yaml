{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R3/boundary-binding.schema.yaml",
  "title": "boundary-binding",
  "type": "object",
  "required": [
    "subject_ref",
    "authority",
    "claims",
    "satisfies",
    "evidence_refs",
    "content_hash"
  ],
  "properties": {
    "subject_ref": {
      "type": "string",
      "minLength": 1
    },
    "authority": {
      "type": "object",
      "required": [
        "layer",
        "ref"
      ],
      "properties": {
        "layer": {
          "type": "string",
          "enum": [
            "SPECIFICATION",
            "PROFILE",
            "IMPLEMENTATION"
          ]
        },
        "ref": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "claims": {
      "type": "array",
      "items": {
        "type": "object",
        "required": [
          "claim_id",
          "statement"
        ],
        "properties": {
          "claim_id": {
            "type": "string",
            "minLength": 1
          },
          "statement": {
            "type": "string",
            "minLength": 1
          }
        },
        "additionalProperties": false
      }
    },
    "satisfies": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "subject_ref"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "GDE-CJSON-1",
  "x-authority-precedence": [
    "SPECIFICATION",
    "PROFILE",
    "IMPLEMENTATION",
    "EVIDENCE"
  ],
  "x-normative-rules": [
    "authority layer identifies normative force",
    "evidence does not redefine authority"
  ]
}
