{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R3/evidence.schema.yaml",
  "title": "evidence",
  "type": "object",
  "required": [
    "evidence_id",
    "subject_ref",
    "source",
    "observation",
    "collected_at",
    "collector",
    "integrity",
    "content_hash"
  ],
  "properties": {
    "evidence_id": {
      "type": "string",
      "minLength": 1
    },
    "subject_ref": {
      "type": "string",
      "minLength": 1
    },
    "source": {
      "type": "object",
      "required": [
        "type",
        "ref"
      ],
      "properties": {
        "type": {
          "type": "string",
          "minLength": 1
        },
        "ref": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "observation": {
      "type": "object",
      "required": [
        "statement"
      ],
      "properties": {
        "statement": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "collected_at": {
      "type": "string",
      "format": "date-time"
    },
    "collector": {
      "type": "object",
      "required": [
        "id",
        "version"
      ],
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1
        },
        "version": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "integrity": {
      "type": "object",
      "required": [
        "hash",
        "status"
      ],
      "properties": {
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "status": {
          "type": "string",
          "enum": [
            "VALID",
            "INVALID",
            "UNKNOWN"
          ]
        }
      },
      "additionalProperties": false
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "evidence_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "GDE-CJSON-1",
  "x-authority-precedence": [
    "SPECIFICATION",
    "PROFILE",
    "IMPLEMENTATION",
    "EVIDENCE"
  ],
  "x-normative-rules": [
    "evidence is descriptive and carries no normative authority"
  ]
}
