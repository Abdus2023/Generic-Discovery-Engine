{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R3/conformance-contract.schema.yaml",
  "title": "conformance-contract",
  "type": "object",
  "required": [
    "contract_id",
    "operation",
    "required_inputs",
    "output_type",
    "forbidden_inferences",
    "non_conformant_requires_violation",
    "absence_of_evidence_default",
    "content_hash"
  ],
  "properties": {
    "contract_id": {
      "type": "string",
      "minLength": 1
    },
    "operation": {
      "type": "string",
      "minLength": 1
    },
    "required_inputs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "output_type": {
      "type": "string",
      "minLength": 1
    },
    "forbidden_inferences": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "non_conformant_requires_violation": {
      "type": "boolean"
    },
    "absence_of_evidence_default": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "contract_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "GDE-CJSON-1",
  "x-authority-precedence": [
    "SPECIFICATION",
    "PROFILE",
    "IMPLEMENTATION",
    "EVIDENCE"
  ],
  "x-normative-rules": [
    "conformance applies requirement acceptance criteria"
  ]
}
