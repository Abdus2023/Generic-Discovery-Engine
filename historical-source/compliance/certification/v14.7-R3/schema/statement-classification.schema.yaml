{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R3/statement-classification.schema.yaml",
  "title": "statement-classification",
  "type": "object",
  "required": [
    "statement_id",
    "source_ref",
    "statement",
    "classification",
    "authority",
    "object_ref",
    "content_hash"
  ],
  "properties": {
    "statement_id": {
      "type": "string",
      "minLength": 1
    },
    "source_ref": {
      "type": "string",
      "minLength": 1
    },
    "statement": {
      "type": "string",
      "minLength": 1
    },
    "classification": {
      "type": "string",
      "enum": [
        "NORMATIVE_REQUIREMENT",
        "ACCEPTANCE_CRITERION",
        "PROFILE_BINDING",
        "IMPLEMENTATION_INSTRUCTION",
        "IMPLEMENTATION_GUIDANCE",
        "OBSERVATION",
        "EVIDENCE"
      ]
    },
    "authority": {
      "type": "object",
      "required": [
        "layer",
        "ref"
      ],
      "properties": {
        "layer": {
          "type": "string",
          "enum": [
            "SPECIFICATION",
            "PROFILE",
            "IMPLEMENTATION"
          ]
        },
        "ref": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "object_ref": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "statement_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "GDE-CJSON-1",
  "x-authority-precedence": [
    "SPECIFICATION",
    "PROFILE",
    "IMPLEMENTATION",
    "EVIDENCE"
  ],
  "x-normative-rules": [
    "exactly one classification"
  ]
}
