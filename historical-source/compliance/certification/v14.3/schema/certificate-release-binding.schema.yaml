{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateReleaseBindingV143",
  "type": "object",
  "required": [
    "release_id",
    "artifact_id",
    "artifact_hash",
    "implementation_id",
    "specification_hash",
    "audit_snapshot_hash",
    "certificate_snapshot_hash",
    "environment_id"
  ],
  "properties": {
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "artifact_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "artifact_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "implementation_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "specification_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "audit_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "certificate_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "environment_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/certificate-release-binding.schema.yaml"
}
