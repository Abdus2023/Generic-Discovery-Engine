{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CurrentReleaseExecutionV143",
  "type": "object",
  "required": [
    "projection_id",
    "entity_id",
    "last_event_id",
    "projected_at",
    "history_hash",
    "schema_version",
    "projection_hash",
    "status",
    "execution_id"
  ],
  "properties": {
    "projection_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "entity_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "last_event_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "projected_at": {
      "type": "string",
      "format": "date-time"
    },
    "history_hash": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "schema_version": {
      "const": "14.3"
    },
    "projection_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "status": {
      "oneOf": [
        {
          "type": "string",
          "enum": [
            "NOT_STARTED",
            "STARTED",
            "SUCCEEDED",
            "FAILED",
            "CANCELLED",
            "ROLLED_BACK"
          ]
        },
        {
          "type": "null"
        }
      ]
    },
    "execution_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/current-release-execution.schema.yaml"
}
