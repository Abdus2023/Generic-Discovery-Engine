{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "ReleaseEligibilityV143",
  "type": "object",
  "required": [
    "eligibility_id",
    "release_id",
    "gate_id",
    "status",
    "predicates",
    "reasons",
    "warnings",
    "evidence_snapshot_hash",
    "evaluated_at",
    "schema_version",
    "eligibility_hash"
  ],
  "properties": {
    "eligibility_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "gate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "status": {
      "type": "string",
      "enum": [
        "ELIGIBLE",
        "INELIGIBLE",
        "BLOCKED",
        "UNKNOWN"
      ]
    },
    "predicates": {
      "type": "array",
      "items": {
        "$ref": "predicate-evaluation.schema.yaml"
      }
    },
    "reasons": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "warnings": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "evidence_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.3"
    },
    "eligibility_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/release-eligibility.schema.yaml"
}
