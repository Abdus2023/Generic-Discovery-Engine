{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "ReleaseV143",
  "type": "object",
  "required": [
    "release_id",
    "implementation_id",
    "artifact",
    "version",
    "specification",
    "environment",
    "source",
    "build_hash",
    "configuration_hash",
    "created_at",
    "schema_version",
    "release_hash"
  ],
  "properties": {
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "implementation_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "artifact": {
      "type": "object",
      "required": [
        "artifact_id",
        "content_hash"
      ],
      "properties": {
        "artifact_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        "content_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
      },
      "additionalProperties": false
    },
    "version": {
      "type": "object",
      "required": [
        "value"
      ],
      "properties": {
        "value": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "specification": {
      "type": "object",
      "required": [
        "specification_id",
        "specification_hash"
      ],
      "properties": {
        "specification_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        "specification_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
      },
      "additionalProperties": false
    },
    "environment": {
      "type": "object",
      "required": [
        "environment_id",
        "environment_hash"
      ],
      "properties": {
        "environment_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        "environment_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
      },
      "additionalProperties": false
    },
    "source": {
      "type": "object",
      "required": [
        "repository_id",
        "commit_hash"
      ],
      "properties": {
        "repository_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        "commit_hash": {
          "oneOf": [
            {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "additionalProperties": false
    },
    "build_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "configuration_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.3"
    },
    "release_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-v14.3-rules": [
    "version.value is a label, not identity"
  ],
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/release.schema.yaml"
}
