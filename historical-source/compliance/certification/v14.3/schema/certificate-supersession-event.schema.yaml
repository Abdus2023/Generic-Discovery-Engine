{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateSupersessionEventV143",
  "type": "object",
  "required": [
    "event_id",
    "entity_id",
    "occurred_at",
    "actor_or_authority",
    "snapshot_hash",
    "previous_event_id",
    "evidence_refs",
    "schema_version",
    "content_hash",
    "event_type",
    "replacement_certificate_id",
    "authority"
  ],
  "properties": {
    "event_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "entity_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "occurred_at": {
      "type": "string",
      "format": "date-time"
    },
    "actor_or_authority": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "previous_event_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "evidence_refs": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "schema_version": {
      "const": "14.3"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "event_type": {
      "type": "string",
      "enum": [
        "SUPERSEDED"
      ]
    },
    "replacement_certificate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authority": {
      "$ref": "authority.schema.yaml"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/certificate-supersession-event.schema.yaml"
}
