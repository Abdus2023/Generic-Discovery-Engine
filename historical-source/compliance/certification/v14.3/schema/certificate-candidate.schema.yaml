{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateCandidateV143",
  "type": "object",
  "required": [
    "candidate_id",
    "subject",
    "intended_certificate_type",
    "specification_id",
    "specification_hash",
    "audit_snapshot_id",
    "audit_snapshot_hash",
    "aggregate_id",
    "aggregate_hash",
    "eligibility_id",
    "evidence_refs",
    "lifecycle_state",
    "retention_until",
    "provenance_refs",
    "created_at",
    "schema_version",
    "candidate_hash"
  ],
  "properties": {
    "candidate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "subject": {
      "type": "string",
      "minLength": 1
    },
    "intended_certificate_type": {
      "type": "string",
      "minLength": 1
    },
    "specification_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "specification_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "audit_snapshot_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "audit_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "aggregate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "aggregate_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "eligibility_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "evidence_refs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "lifecycle_state": {
      "type": "string",
      "enum": [
        "CREATED",
        "ACTIVE",
        "CONSUMED",
        "CANCELLED",
        "EXPIRED",
        "RETAINED"
      ]
    },
    "retention_until": {
      "oneOf": [
        {
          "type": "string",
          "format": "date-time"
        },
        {
          "type": "null"
        }
      ]
    },
    "provenance_refs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.3"
    },
    "candidate_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-v14.3-rules": [
    "candidate lifecycle is not certificate lifecycle"
  ],
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/certificate-candidate.schema.yaml"
}
