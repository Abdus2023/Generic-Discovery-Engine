{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateValidityV143",
  "type": "object",
  "required": [
    "validity_id",
    "certificate_id",
    "status",
    "predicates",
    "reasons",
    "evaluated_at",
    "schema_version",
    "validity_hash"
  ],
  "properties": {
    "validity_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "certificate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "status": {
      "type": "string",
      "enum": [
        "VALID",
        "INVALID",
        "NOT_YET_VALID",
        "UNKNOWN"
      ]
    },
    "predicates": {
      "type": "array",
      "items": {
        "$ref": "predicate-evaluation.schema.yaml"
      }
    },
    "reasons": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.3"
    },
    "validity_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.3/certificate-validity.schema.yaml"
}
