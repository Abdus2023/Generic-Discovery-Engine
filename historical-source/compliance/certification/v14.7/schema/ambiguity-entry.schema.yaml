{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/ambiguity-entry.schema.yaml",
  "title": "ambiguity-entry",
  "type": "object",
  "required": [
    "ambiguity_id",
    "question",
    "affected_objects",
    "why_unresolved",
    "minimum_safe_rule",
    "default_fail_closed_behavior",
    "classification",
    "content_hash",
    "scope_id",
    "scope_hash",
    "created_at"
  ],
  "properties": {
    "ambiguity_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "question": {
      "type": "string",
      "minLength": 1
    },
    "affected_objects": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      },
      "minItems": 1
    },
    "why_unresolved": {
      "type": "string",
      "minLength": 1
    },
    "minimum_safe_rule": {
      "type": "string",
      "minLength": 1
    },
    "default_fail_closed_behavior": {
      "type": "string",
      "minLength": 1
    },
    "classification": {
      "type": "string",
      "enum": [
        "SAFETY_RELEVANT_OPEN_QUESTION",
        "NON_NORMATIVE_IMPLEMENTATION_CHOICE"
      ]
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "ambiguity_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS_WITH_PROFILED_SKEW",
  "x-scope-validation": "CANONICAL_SCOPE_SET_AND_SCOPE_HASH",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "only genuine unresolved questions"
  ]
}
