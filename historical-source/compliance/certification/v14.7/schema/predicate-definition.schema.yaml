{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/predicate-definition.schema.yaml",
  "title": "predicate-definition",
  "type": "object",
  "required": [
    "predicate_id",
    "semantics",
    "classification",
    "unknown_allowed",
    "evidence_requirements",
    "scope_id",
    "scope_hash",
    "content_hash",
    "created_at"
  ],
  "properties": {
    "predicate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "semantics": {
      "type": "string",
      "minLength": 1
    },
    "classification": {
      "type": "string",
      "enum": [
        "MANDATORY",
        "OPTIONAL"
      ]
    },
    "unknown_allowed": {
      "type": "boolean"
    },
    "evidence_requirements": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      }
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "predicate_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "semantics must be deterministic or UNKNOWN explicitly allowed",
    "v14.7 canonical failure taxonomy and validation procedure apply"
  ],
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY"
}
