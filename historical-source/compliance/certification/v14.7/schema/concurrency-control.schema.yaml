{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/concurrency-control.schema.yaml",
  "title": "concurrency-control",
  "type": "object",
  "required": [
    "control_id",
    "operation",
    "aggregate_scope",
    "idempotency_scope",
    "uniqueness_constraints",
    "commit_mode",
    "conflict_result",
    "winner_rule",
    "retry_rule",
    "content_hash",
    "scope_id",
    "scope_hash",
    "created_at"
  ],
  "properties": {
    "control_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "operation": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "aggregate_scope": {
      "type": "string",
      "minLength": 1
    },
    "idempotency_scope": {
      "type": "string",
      "minLength": 1
    },
    "uniqueness_constraints": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      },
      "minItems": 1
    },
    "commit_mode": {
      "const": "LINEARIZABLE_ATOMIC_COMPARE_AND_APPEND"
    },
    "conflict_result": {
      "const": "CONCURRENCY_FAILURE"
    },
    "winner_rule": {
      "type": "string",
      "minLength": 1
    },
    "retry_rule": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "control_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS_WITH_PROFILED_SKEW",
  "x-scope-validation": "CANONICAL_SCOPE_SET_AND_SCOPE_HASH",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "implementation may use optimistic or pessimistic mechanism only with equivalent semantics"
  ]
}
