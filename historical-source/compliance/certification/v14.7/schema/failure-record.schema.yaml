{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/failure-record.schema.yaml",
  "title": "failure-record",
  "type": "object",
  "required": [
    "failure_id",
    "object_ref",
    "boundary",
    "input_ref",
    "failure_class",
    "evidence_refs",
    "severity",
    "retry_meaningful",
    "authorization_prohibited",
    "occurred_at",
    "sequence_no",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "failure_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "object_ref": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "boundary": {
      "type": "string",
      "enum": [
        "L0_STRUCTURAL",
        "L1_REFERENTIAL",
        "L2_INTEGRITY",
        "L3_SEMANTIC",
        "L4_AUTHORIZATION"
      ]
    },
    "input_ref": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "failure_class": {
      "type": "string",
      "enum": [
        "STRUCTURAL_FAILURE",
        "REFERENCE_FAILURE",
        "INTEGRITY_FAILURE",
        "TEMPORAL_FAILURE",
        "SCOPE_FAILURE",
        "POLICY_FAILURE",
        "EVIDENCE_FAILURE",
        "FRESHNESS_FAILURE",
        "EVALUATION_FAILURE",
        "AUTHORITY_FAILURE",
        "AUTHORIZATION_FAILURE",
        "STATE_TRANSITION_FAILURE",
        "EVENT_ORDER_FAILURE",
        "PROJECTION_FAILURE",
        "CONCURRENCY_FAILURE",
        "RESOURCE_FAILURE",
        "EXECUTION_FAILURE",
        "VERIFICATION_FAILURE"
      ]
    },
    "evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      }
    },
    "severity": {
      "type": "string",
      "enum": [
        "INFO",
        "WARNING",
        "ERROR",
        "CRITICAL"
      ]
    },
    "retry_meaningful": {
      "type": "boolean"
    },
    "authorization_prohibited": {
      "type": "boolean"
    },
    "occurred_at": {
      "type": "string",
      "format": "date-time"
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "failure_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "responsible layer must be preserved",
    "v14.7 canonical failure taxonomy and validation procedure apply"
  ],
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY"
}
