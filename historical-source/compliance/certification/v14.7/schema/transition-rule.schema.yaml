{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/transition-rule.schema.yaml",
  "title": "transition-rule",
  "type": "object",
  "required": [
    "transition_id",
    "object_type",
    "from_state",
    "event",
    "guards",
    "required_evidence",
    "authority",
    "to_state",
    "side_effects",
    "forbidden_side_effects",
    "content_hash",
    "scope_id",
    "scope_hash",
    "created_at"
  ],
  "properties": {
    "transition_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "object_type": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "from_state": {
      "type": "string",
      "minLength": 1
    },
    "event": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "guards": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "required_evidence": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      }
    },
    "authority": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "to_state": {
      "type": "string",
      "minLength": 1
    },
    "side_effects": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "forbidden_side_effects": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      },
      "minItems": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "transition_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS_WITH_PROFILED_SKEW",
  "x-scope-validation": "CANONICAL_SCOPE_SET_AND_SCOPE_HASH",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "derived snapshot replacement is not historical object mutation"
  ]
}
