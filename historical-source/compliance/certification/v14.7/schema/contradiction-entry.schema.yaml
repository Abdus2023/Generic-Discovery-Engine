{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/contradiction-entry.schema.yaml",
  "title": "contradiction-entry",
  "type": "object",
  "required": [
    "contradiction_id",
    "location",
    "old_rule",
    "new_rule",
    "resolution",
    "reason",
    "impact",
    "content_hash",
    "scope_id",
    "scope_hash",
    "created_at"
  ],
  "properties": {
    "contradiction_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "location": {
      "type": "string",
      "minLength": 1
    },
    "old_rule": {
      "type": "string",
      "minLength": 1
    },
    "new_rule": {
      "type": "string",
      "minLength": 1
    },
    "resolution": {
      "type": "string",
      "minLength": 1
    },
    "reason": {
      "type": "string",
      "minLength": 1
    },
    "impact": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "contradiction_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_HASH_MATCHED_TARGET",
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS_WITH_PROFILED_SKEW",
  "x-scope-validation": "CANONICAL_SCOPE_SET_AND_SCOPE_HASH",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY",
  "x-normative-rules": [
    "no silent semantic repair"
  ]
}
