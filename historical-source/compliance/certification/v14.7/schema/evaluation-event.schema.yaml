{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7/evaluation-event.schema.yaml",
  "title": "evaluation-event",
  "type": "object",
  "required": [
    "event_id",
    "subject_id",
    "event_type",
    "occurred_at",
    "committed_at",
    "sequence_no",
    "previous_event_id",
    "scope_id",
    "scope_hash",
    "content_hash",
    "evaluation_id",
    "event_status",
    "idempotency_key",
    "aggregate_id",
    "expected_version",
    "committed_version",
    "commit_index"
  ],
  "properties": {
    "event_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "subject_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "event_type": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "occurred_at": {
      "type": "string",
      "format": "date-time"
    },
    "committed_at": {
      "type": "string",
      "format": "date-time"
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "previous_event_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evaluation_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "event_status": {
      "type": "string",
      "enum": [
        "EVALUATION_CREATED",
        "EVALUATION_COMPLETED",
        "EVALUATION_INVALIDATED"
      ]
    },
    "idempotency_key": {
      "type": "string",
      "minLength": 1
    },
    "aggregate_id": {
      "type": "string",
      "minLength": 1
    },
    "expected_version": {
      "type": "integer",
      "minimum": -1
    },
    "committed_version": {
      "type": "integer",
      "minimum": 0
    },
    "commit_index": {
      "type": "integer",
      "minimum": 0
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "event_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "invalidation does not mutate evaluation result",
    "v14.7 canonical failure taxonomy and validation procedure apply",
    "atomic compare-and-append and unique idempotency key required"
  ],
  "x-nullability": "ONLY_EXPLICIT_ONEOF_NULL_FIELDS_ARE_NULLABLE",
  "x-version-relationship": "VERSION_LABEL_IS_METADATA_NOT_IDENTITY"
}
