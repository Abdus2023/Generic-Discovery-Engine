{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "AuthorityPolicy",
  "type": "object",
  "required": [
    "policy_id",
    "purpose",
    "allowed_authority_types",
    "authorization_evidence_required",
    "signature_profiles",
    "schema_version",
    "policy_hash"
  ],
  "properties": {
    "policy_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "purpose": {
      "type": "string",
      "enum": [
        "CERTIFICATION",
        "WAIVER",
        "RELEASE"
      ]
    },
    "allowed_authority_types": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string",
        "enum": [
          "HUMAN",
          "ORGANIZATION",
          "AUTOMATED_POLICY",
          "TRUSTED_SERVICE"
        ]
      },
      "uniqueItems": true
    },
    "authorization_evidence_required": {
      "type": "boolean"
    },
    "signature_profiles": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "schema_version": {
      "const": "14.0"
    },
    "policy_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14/authority-policy.schema.yaml"
}
