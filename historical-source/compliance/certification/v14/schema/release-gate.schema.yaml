{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "ReleaseGate",
  "type": "object",
  "required": [
    "gate_id",
    "release_id",
    "policy_id",
    "release_snapshot_hash",
    "certificate_ids",
    "required_certificate_types",
    "required_aggregate_status",
    "forbidden_findings",
    "required_waiver_policy",
    "evidence_freshness_policy",
    "required_security_status",
    "state",
    "decision",
    "evaluated_at",
    "schema_version",
    "gate_hash"
  ],
  "properties": {
    "gate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "policy_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "certificate_ids": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "required_certificate_types": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "required_aggregate_status": {
      "type": "string",
      "enum": [
        "COMPLIANT",
        "CONDITIONALLY_COMPLIANT"
      ]
    },
    "forbidden_findings": {
      "type": "array",
      "minItems": 0,
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "required_waiver_policy": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "evidence_freshness_policy": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "required_security_status": {
      "type": "string",
      "minLength": 1
    },
    "state": {
      "type": "string",
      "enum": [
        "CREATED",
        "EVALUATING",
        "BLOCKED",
        "REJECTED",
        "PASSED",
        "AUTHORIZED",
        "CONDITIONALLY_AUTHORIZED"
      ]
    },
    "decision": {
      "type": "string",
      "enum": [
        "AUTHORIZED",
        "CONDITIONALLY_AUTHORIZED",
        "REJECTED",
        "BLOCKED",
        "EXPIRED",
        "UNKNOWN"
      ]
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.0"
    },
    "gate_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14/release-gate.schema.yaml"
}
