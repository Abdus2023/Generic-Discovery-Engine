{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateSignature",
  "type": "object",
  "required": [
    "profile",
    "signer_authority_id",
    "signed_at",
    "signature_value"
  ],
  "properties": {
    "profile": {
      "type": "string",
      "minLength": 1
    },
    "signer_authority_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "signed_at": {
      "type": "string",
      "format": "date-time"
    },
    "signature_value": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14/certificate-signature.schema.yaml"
}
