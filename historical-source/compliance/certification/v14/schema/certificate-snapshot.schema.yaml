{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CertificateSnapshot",
  "type": "object",
  "required": [
    "snapshot_id",
    "audit_id",
    "specification_snapshot",
    "implementation_snapshot",
    "decision_snapshot",
    "evidence_snapshot",
    "waiver_snapshot",
    "state_history_snapshot",
    "aggregate_hash",
    "scope_snapshot",
    "generated_at",
    "release_binding",
    "snapshot_hash"
  ],
  "properties": {
    "snapshot_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "audit_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "specification_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "implementation_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "decision_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evidence_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "waiver_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "state_history_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "aggregate_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "generated_at": {
      "type": "string",
      "format": "date-time"
    },
    "release_binding": {
      "type": "object",
      "required": [
        "source_snapshot",
        "build_snapshot",
        "configuration_snapshot",
        "artifact_hashes"
      ],
      "properties": {
        "source_snapshot": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "build_snapshot": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "configuration_snapshot": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "artifact_hashes": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "artifact-hash.schema.yaml"
          }
        }
      },
      "additionalProperties": false
    },
    "snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14/certificate-snapshot.schema.yaml"
}
