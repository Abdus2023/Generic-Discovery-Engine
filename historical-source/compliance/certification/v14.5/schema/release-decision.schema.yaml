{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.5/release-decision.schema.yaml",
  "title": "release-decision",
  "type": "object",
  "required": [
    "decision_id",
    "release_id",
    "gate_id",
    "eligibility_id",
    "certificate_validity_id",
    "authority_id",
    "policy_id",
    "decision_status",
    "decision_basis_hash",
    "snapshot_hash",
    "reason_codes",
    "decided_at",
    "valid_until",
    "previous_decision_id",
    "sequence_no",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "decision_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "gate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "eligibility_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "certificate_validity_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authority_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "policy_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "decision_status": {
      "type": "string",
      "enum": [
        "APPROVED",
        "REJECTED",
        "BLOCKED",
        "DEFERRED"
      ]
    },
    "decision_basis_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "reason_codes": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "decided_at": {
      "type": "string",
      "format": "date-time"
    },
    "valid_until": {
      "oneOf": [
        {
          "type": "string",
          "format": "date-time"
        },
        {
          "type": "null"
        }
      ]
    },
    "previous_decision_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "decision_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "DEFERRED requires UNKNOWN eligibility, authorized actor, explicit action and reason",
    "immutable authority action"
  ]
}
