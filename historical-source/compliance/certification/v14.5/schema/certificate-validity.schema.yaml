{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.5/certificate-validity.schema.yaml",
  "title": "certificate-validity",
  "type": "object",
  "required": [
    "validity_id",
    "certificate_id",
    "context_id",
    "predicate_evaluation_ids",
    "validity_status",
    "basis_hash",
    "evaluated_at",
    "sequence_no",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "validity_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "certificate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "context_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "predicate_evaluation_ids": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      },
      "minItems": 1
    },
    "validity_status": {
      "type": "string",
      "enum": [
        "VALID",
        "INVALID",
        "NOT_YET_VALID",
        "UNKNOWN"
      ]
    },
    "basis_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "validity_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "derived from valid EvaluationResult objects",
    "aggregate INVALID produces no authoritative CertificateValidity object",
    "invalidity fabricates no lifecycle event"
  ]
}
