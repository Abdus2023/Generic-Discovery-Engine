{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.5/certificate-candidate.schema.yaml",
  "title": "certificate-candidate",
  "type": "object",
  "required": [
    "certificate_candidate_id",
    "candidate_state",
    "certificate_type",
    "proposed_payload_hash",
    "specification_id",
    "specification_hash",
    "implementation_id",
    "implementation_hash",
    "release_id",
    "release_hash",
    "audit_snapshot_id",
    "audit_snapshot_hash",
    "eligibility_policy_ref",
    "authority_policy_ref",
    "evidence_refs",
    "created_at",
    "sequence_no",
    "scope_id",
    "scope_hash",
    "content_hash"
  ],
  "properties": {
    "certificate_candidate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "candidate_state": {
      "type": "string",
      "enum": [
        "CREATED",
        "ACTIVE",
        "CONSUMED",
        "CANCELLED",
        "EXPIRED",
        "RETAINED"
      ]
    },
    "certificate_type": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "proposed_payload_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "specification_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "specification_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "implementation_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "implementation_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "audit_snapshot_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "audit_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "eligibility_policy_ref": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authority_policy_ref": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
      },
      "minItems": 1
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    },
    "sequence_no": {
      "type": "integer",
      "minimum": 0
    },
    "scope_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "scope_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "certificate_candidate_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-reference-resolution": "EXACTLY_ONE_TYPED_TARGET_FOR_EACH_NON_NULL_REFERENCE",
  "x-timestamp-semantics": "RFC3339_UTC_HALF_OPEN_INTERVALS",
  "x-scope-validation": "EXPLICIT_SCOPE_HASH_MATCH",
  "x-normative-rules": [
    "distinct from discovery Candidate and Certificate(DRAFT)",
    "VALIDATED EVALUATED AUTHORIZED are workflow outcomes not candidate lifecycle states"
  ]
}
