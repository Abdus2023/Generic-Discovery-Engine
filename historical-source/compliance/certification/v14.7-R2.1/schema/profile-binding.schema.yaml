{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2.1/profile-binding.schema.yaml",
  "title": "profile-binding",
  "type": "object",
  "required": [
    "binding_id",
    "requirement_id",
    "profile_id",
    "profile_version",
    "binding_statement",
    "preservation_evidence_refs",
    "content_hash"
  ],
  "properties": {
    "binding_id": {
      "type": "string",
      "minLength": 1
    },
    "requirement_id": {
      "type": "string",
      "minLength": 1
    },
    "profile_id": {
      "type": "string",
      "minLength": 1
    },
    "profile_version": {
      "type": "string",
      "minLength": 1
    },
    "binding_statement": {
      "type": "string",
      "minLength": 1
    },
    "preservation_evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "binding_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "profile specializes without weakening"
  ]
}
