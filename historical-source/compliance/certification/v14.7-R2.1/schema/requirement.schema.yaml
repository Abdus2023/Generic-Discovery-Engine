{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2.1/requirement.schema.yaml",
  "title": "requirement",
  "type": "object",
  "required": [
    "requirement_id",
    "specification_id",
    "specification_version",
    "statement",
    "normative_strength",
    "scope",
    "preconditions",
    "postconditions",
    "invariants",
    "acceptance_criteria",
    "negative_conditions",
    "dependencies",
    "conflicts",
    "traceability",
    "content_hash"
  ],
  "properties": {
    "requirement_id": {
      "type": "string",
      "minLength": 1
    },
    "specification_id": {
      "type": "string",
      "minLength": 1
    },
    "specification_version": {
      "type": "string",
      "minLength": 1
    },
    "statement": {
      "type": "object"
    },
    "normative_strength": {
      "type": "string",
      "enum": [
        "MUST",
        "MUST_NOT",
        "SHOULD",
        "SHOULD_NOT",
        "MAY"
      ]
    },
    "scope": {
      "type": "object"
    },
    "preconditions": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "postconditions": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "invariants": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "acceptance_criteria": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "negative_conditions": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "dependencies": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "conflicts": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "traceability": {
      "type": "object"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "requirement_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "statement mechanism-free unless mechanism normative"
  ]
}
