{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2.1/profile-compatibility.schema.yaml",
  "title": "profile-compatibility",
  "type": "object",
  "required": [
    "compatibility_id",
    "source_profile",
    "target_profile",
    "classification",
    "migration_required",
    "semantic_equivalence",
    "migration",
    "evidence_refs",
    "content_hash"
  ],
  "properties": {
    "compatibility_id": {
      "type": "string",
      "minLength": 1
    },
    "source_profile": {
      "type": "string",
      "minLength": 1
    },
    "target_profile": {
      "type": "string",
      "minLength": 1
    },
    "classification": {
      "type": "string",
      "enum": [
        "IDENTICAL",
        "BACKWARD_COMPATIBLE",
        "FORWARD_COMPATIBLE",
        "CONVERTIBLE",
        "INCOMPATIBLE"
      ]
    },
    "migration_required": {
      "type": "boolean"
    },
    "semantic_equivalence": {
      "type": "string",
      "enum": [
        "PROVEN",
        "ESTABLISHED",
        "UNKNOWN"
      ]
    },
    "migration": {
      "type": "object"
    },
    "evidence_refs": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "compatibility_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "never inferred from versions"
  ]
}
