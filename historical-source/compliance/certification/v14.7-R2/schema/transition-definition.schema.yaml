{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2/transition-definition.schema.yaml",
  "title": "transition-definition",
  "type": "object",
  "required": [
    "transition_id",
    "object_type",
    "from_state",
    "event_type",
    "guard_expression",
    "required_evidence",
    "required_authority_operation",
    "required_authority_type",
    "to_state",
    "side_effects",
    "forbidden_side_effects",
    "semantic_override_profile",
    "content_hash"
  ],
  "properties": {
    "transition_id": {
      "type": "string",
      "minLength": 1
    },
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "from_state": {
      "type": "string",
      "minLength": 1
    },
    "event_type": {
      "type": "string",
      "minLength": 1
    },
    "guard_expression": {
      "type": "string",
      "minLength": 1
    },
    "required_evidence": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "required_authority_operation": {
      "type": "string",
      "minLength": 1
    },
    "required_authority_type": {
      "type": "string",
      "minLength": 1
    },
    "to_state": {
      "type": "string",
      "minLength": 1
    },
    "side_effects": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "forbidden_side_effects": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "semantic_override_profile": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "transition_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "all guards mechanically checked"
  ]
}
