{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2/serialization-profile.schema.yaml",
  "title": "serialization-profile",
  "type": "object",
  "required": [
    "profile_id",
    "version",
    "format",
    "encoding",
    "field_order",
    "map_order",
    "array_order",
    "number_rule",
    "timestamp_rule",
    "unicode_normalization",
    "null_rule",
    "canonical_byte_rule",
    "function",
    "same_semantics_invariant",
    "content_hash"
  ],
  "properties": {
    "profile_id": {
      "type": "string",
      "minLength": 1
    },
    "version": {
      "type": "string",
      "minLength": 1
    },
    "format": {
      "type": "string",
      "minLength": 1
    },
    "encoding": {
      "type": "string",
      "minLength": 1
    },
    "field_order": {
      "type": "string",
      "minLength": 1
    },
    "map_order": {
      "type": "string",
      "minLength": 1
    },
    "array_order": {
      "type": "string",
      "minLength": 1
    },
    "number_rule": {
      "type": "string",
      "minLength": 1
    },
    "timestamp_rule": {
      "type": "string",
      "minLength": 1
    },
    "unicode_normalization": {
      "type": "string",
      "minLength": 1
    },
    "null_rule": {
      "type": "string",
      "minLength": 1
    },
    "canonical_byte_rule": {
      "type": "string",
      "minLength": 1
    },
    "function": {
      "type": "string",
      "minLength": 1
    },
    "same_semantics_invariant": {
      "type": "boolean"
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "profile_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "floats forbidden",
    "normalized key collisions invalid"
  ]
}
