{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.7-R2/event-store-contract.schema.yaml",
  "title": "event-store-contract",
  "type": "object",
  "required": [
    "contract_id",
    "interfaces",
    "guarantees",
    "serialization_point",
    "conflict_result",
    "content_hash"
  ],
  "properties": {
    "contract_id": {
      "type": "string",
      "minLength": 1
    },
    "interfaces": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "guarantees": {
      "type": "array",
      "items": {
        "type": "string",
        "minLength": 1
      }
    },
    "serialization_point": {
      "type": "string",
      "minLength": 1
    },
    "conflict_result": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-identity-fields": [
    "contract_id"
  ],
  "x-immutable": true,
  "x-self-excluding-hash-field": "content_hash",
  "x-canonical-profile": "gde-cjson-1",
  "x-normative-rules": [
    "trusted history requires every guarantee"
  ]
}
