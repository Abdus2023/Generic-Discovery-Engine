{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "IssuanceAuthorizationV141",
  "type": "object",
  "required": [
    "authorization_id",
    "candidate_id",
    "authority",
    "valid",
    "evidence_refs",
    "authorized_at",
    "schema_version",
    "authorization_hash"
  ],
  "properties": {
    "authorization_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "candidate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authority": {
      "$ref": "certification-authority.schema.yaml"
    },
    "valid": {
      "type": "boolean"
    },
    "evidence_refs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "authorized_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.1"
    },
    "authorization_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.1/issuance-authorization.schema.yaml"
}
