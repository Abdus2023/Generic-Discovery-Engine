{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "IssuanceActionV141",
  "type": "object",
  "required": [
    "action_id",
    "candidate_id",
    "eligibility_id",
    "authorization_id",
    "requested",
    "occurred_at",
    "schema_version",
    "action_hash"
  ],
  "properties": {
    "action_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "candidate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "eligibility_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authorization_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "requested": {
      "type": "boolean"
    },
    "occurred_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.1"
    },
    "action_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.1/issuance-action.schema.yaml"
}
