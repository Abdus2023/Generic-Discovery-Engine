{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "SupersessionActionV141",
  "type": "object",
  "required": [
    "supersession_id",
    "certificate_id",
    "replacement_certificate_id",
    "authority",
    "evidence_refs",
    "superseded_at",
    "schema_version",
    "supersession_hash"
  ],
  "properties": {
    "supersession_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "certificate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "replacement_certificate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "authority": {
      "$ref": "certification-authority.schema.yaml"
    },
    "evidence_refs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string",
        "minLength": 1
      },
      "uniqueItems": true
    },
    "superseded_at": {
      "type": "string",
      "format": "date-time"
    },
    "schema_version": {
      "const": "14.1"
    },
    "supersession_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.1/supersession-action.schema.yaml"
}
