{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "EligibilityHistoryV141",
  "type": "object",
  "required": [
    "history_id",
    "certificate_candidate_id",
    "decisions",
    "schema_version",
    "history_hash"
  ],
  "properties": {
    "history_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "certificate_candidate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "decisions": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "certificate-eligibility-decision.schema.yaml"
      }
    },
    "schema_version": {
      "const": "14.1"
    },
    "history_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.1/eligibility-history.schema.yaml"
}
