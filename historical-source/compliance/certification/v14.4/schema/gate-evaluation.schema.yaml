{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.4/gate-evaluation.schema.yaml",
  "title": "gate-evaluation",
  "type": "object",
  "required": [
    "evaluation_id",
    "gate_id",
    "release_id",
    "predicate_results",
    "status",
    "evaluated_at",
    "evidence_snapshot_hash",
    "evaluation_hash"
  ],
  "properties": {
    "evaluation_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "gate_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "release_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "predicate_results": {
      "type": "array",
      "items": {
        "type": "object"
      }
    },
    "status": {
      "type": "string",
      "enum": [
        "ELIGIBLE",
        "INELIGIBLE",
        "BLOCKED",
        "UNKNOWN"
      ]
    },
    "evaluated_at": {
      "type": "string",
      "format": "date-time"
    },
    "evidence_snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "evaluation_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-v14.4-rules": [
    "gate policy remains separate"
  ]
}
