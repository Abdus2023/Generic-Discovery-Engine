{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v14.4/decision-supersession-event.schema.yaml",
  "title": "decision-supersession-event",
  "type": "object",
  "required": [
    "event_id",
    "old_decision_id",
    "new_decision_id",
    "effective_at",
    "authority_id",
    "previous_event_id",
    "content_hash"
  ],
  "properties": {
    "event_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "old_decision_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "new_decision_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "effective_at": {
      "type": "string",
      "format": "date-time"
    },
    "authority_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "previous_event_id": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "content_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-v14.4-rules": [
    "old and new decision identities differ; old decision is immutable"
  ]
}
