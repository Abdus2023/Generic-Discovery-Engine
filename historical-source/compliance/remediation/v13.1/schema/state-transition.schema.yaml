    },
    "subject": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Reference"
    },
    "state_domain": {
      "type": "string",
      "enum": [
        "FINDING",
        "REMEDIATION",
        "PROGRAM",
        "CONFORMANCE"
      ]
