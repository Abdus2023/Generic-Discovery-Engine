{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.1/state-transition.schema.yaml",
  "title": "Protocol-v13.1 immutable STATE_TRANSITION",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "content_hash",
    "subject",
    "state_domain",
    "from_state",
    "to_state",
    "reason",
    "evidence",
    "occurred_at"
