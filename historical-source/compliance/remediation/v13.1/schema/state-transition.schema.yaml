    "from_state": {
      "type": "string",
      "enum": [
        "ACTIVE",
        "APPROVED",
        "ASSESSED",
        "BLOCKED",
        "CANCELLED",
        "CLASSIFIED",
        "CLOSED",
        "COMPLETE",
        "COMPLETED",
        "CONFORMANT",
        "CREATED",
        "DETECTED",
        "EVALUATING",
        "FAILED",
        "IN_PROGRESS",
        "MAPPED",
        "NON_CONFORMANT",
        "NOT_APPLICABLE",
        "OPEN",
        "PARTIALLY_CONFORMANT",
        "PLANNED",
        "PROPOSED",
        "READY_FOR_VERIFICATION",
        "REGRESSION",
        "REJECTED",
        "RESOLVED",
        "REVERIFICATION",
        "SUPERSEDED",
        "TRIAGED",
        "UNASSESSED",
        "UNDER_REMEDIATION",
        "UNKNOWN",
        "UNVERIFIED",
        "VALIDATED",
        "VERIFIED",
        "WAIVED"
      ]
    },
    "to_state": {
      "type": "string",
      "enum": [
        "ACTIVE",
        "APPROVED",
        "ASSESSED",
        "BLOCKED",
        "CANCELLED",
        "CLASSIFIED",
        "CLOSED",
        "COMPLETE",
        "COMPLETED",
        "CONFORMANT",
        "CREATED",
        "DETECTED",
        "EVALUATING",
        "FAILED",
        "IN_PROGRESS",
        "MAPPED",
        "NON_CONFORMANT",
        "NOT_APPLICABLE",
        "OPEN",
        "PARTIALLY_CONFORMANT",
        "PLANNED",
        "PROPOSED",
        "READY_FOR_VERIFICATION",
        "REGRESSION",
        "REJECTED",
        "RESOLVED",
        "REVERIFICATION",
        "SUPERSEDED",
        "TRIAGED",
        "UNASSESSED",
        "UNDER_REMEDIATION",
        "UNKNOWN",
        "UNVERIFIED",
        "VALIDATED",
        "VERIFIED",
        "WAIVED"
      ]
    },
    "reason": {
      "type": "string",
      "minLength": 1
    },
    "evidence": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "../../../schema/common.schema.yaml#/$defs/Reference"
      }
    },
    "occurred_at": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Timestamp"
    }
  },
  "additionalProperties": false,
  "x-v13.1-rules": [
    "Undefined state transitions are rejected",
    "Transition records are immutable"
  ]
}
