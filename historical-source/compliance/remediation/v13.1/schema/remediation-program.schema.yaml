{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.1/remediation-program.schema.yaml",
  "title": "Protocol-v13.1 REMEDIATION_PROGRAM derived state",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "content_hash",
    "program_id",
    "finding_ids",
    "remediation_ids",
    "derived_program_state"
  ],
  "properties": {
    "object_type": {
      "const": "REMEDIATION_PROGRAM"
    },
    "schema_version": {
      "const": "13.1"
    },
    "object_id": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Timestamp"
    },
    "content_hash": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Hash"
    },
    "program_id": {
      "$ref": "../../../schema/common.schema.yaml#/$defs/Identifier"
    },
    "finding_ids": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "../../../schema/common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "remediation_ids": {
      "type": "array",
      "items": {
        "$ref": "../../../schema/common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "derived_program_state": {
      "type": "string",
      "enum": [
        "CREATED",
        "TRIAGED",
        "PLANNED",
        "ACTIVE",
        "BLOCKED",
        "EVALUATING",
        "COMPLETED",
        "CANCELLED",
        "SUPERSEDED",
        "FAILED"
      ]
    },
    "explicit_terminal_event": {
      "oneOf": [
        {
          "$ref": "../../../schema/common.schema.yaml#/$defs/Reference"
        },
        {
          "type": "null"
        }
      ]
    }
  },
  "additionalProperties": false,
  "x-v13.1-rules": [
    "Program state is derived from member remediation states",
    "Program state never establishes conformance"
  ]
}
