  "definitions": {
    "CREATED": "Program exists but has not undergone triage.",
    "TRIAGED": "Finding and remediation scope were assessed sufficiently to determine program appropriateness.",
    "PLANNED": "Required actions and dependencies are defined.",
    "ACTIVE": "At least one remediation action is actively executing.",
    "EVALUATING": "Changes exist and re-verification or regression evaluation is underway or pending.",
    "COMPLETED": "All required actions and post-remediation evaluation completed; this has no conformance implication.",
    "BLOCKED": "An identified dependency, environment, authorization, artifact, or verification blocker prevents progress.",
    "FAILED": "The current remediation plan cannot achieve its declared objective.",
    "CANCELLED": "The program was intentionally terminated without completion.",
    "SUPERSEDED": "A newer remediation program replaces this immutable record."
  },
