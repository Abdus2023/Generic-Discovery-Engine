{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Protocol-v13.2 CurrentState",
  "type": "object",
  "required": [
    "current_state_id",
    "object_type",
    "object_id",
    "state",
    "state_as_of",
    "last_transition_id",
    "transition_sequence",
    "projection_hash"
  ],
  "properties": {
    "current_state_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "object_type": {
      "type": "string"
    },
    "object_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "state": {
      "type": "string"
    },
    "state_as_of": {
      "type": "string",
      "format": "date-time"
    },
    "last_transition_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "transition_sequence": {
      "type": "integer",
      "minimum": 1
    },
    "projection_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "x-v13.2-rules": [
    "Derived only from valid transition history",
    "Not an independent historical source"
  ],
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.2/current-state.schema.yaml"
}
