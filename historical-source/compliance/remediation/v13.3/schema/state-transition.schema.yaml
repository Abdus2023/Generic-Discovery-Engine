{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "StateTransition",
  "type": "object",
  "required": [
    "transition_id",
    "object_type",
    "object_id",
    "from_state",
    "to_state",
    "reason",
    "evidence_refs",
    "actor",
    "occurred_at",
    "sequence",
    "previous_transition",
    "event_hash",
    "schema_version"
  ],
  "properties": {
    "transition_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "object_type": {
      "type": "string",
      "enum": [
        "FINDING",
        "REMEDIATION",
        "PROGRAM",
        "COMPLIANCE_DECISION"
      ]
    },
    "object_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "from_state": {
      "oneOf": [
        {
          "type": "string",
          "enum": [
            "ACTIVE",
            "APPROVED",
            "ASSESSED",
            "BLOCKED",
            "CANCELLED",
            "CLASSIFIED",
            "CLOSED",
            "COMPLETE",
            "COMPLETED",
            "CONFORMANT",
            "CREATED",
            "DETECTED",
            "EVALUATING",
            "FAILED",
            "IN_PROGRESS",
            "MAPPED",
            "NON_CONFORMANT",
            "NOT_APPLICABLE",
            "OPEN",
            "PARTIALLY_CONFORMANT",
            "PLANNED",
            "PROPOSED",
            "READY_FOR_VERIFICATION",
            "REGRESSION",
            "REJECTED",
            "RESOLVED",
            "REVERIFICATION",
            "SUPERSEDED",
            "TRIAGED",
            "UNASSESSED",
            "UNDER_REMEDIATION",
            "UNKNOWN",
            "UNVERIFIED",
            "VALIDATED",
            "VERIFIED",
            "WAIVED"
          ]
        },
        {
          "type": "null"
        }
      ]
    },
    "to_state": {
      "type": "string",
      "enum": [
        "ACTIVE",
        "APPROVED",
        "ASSESSED",
        "BLOCKED",
        "CANCELLED",
        "CLASSIFIED",
        "CLOSED",
        "COMPLETE",
        "COMPLETED",
        "CONFORMANT",
        "CREATED",
        "DETECTED",
        "EVALUATING",
        "FAILED",
        "IN_PROGRESS",
        "MAPPED",
        "NON_CONFORMANT",
        "NOT_APPLICABLE",
        "OPEN",
        "PARTIALLY_CONFORMANT",
        "PLANNED",
        "PROPOSED",
        "READY_FOR_VERIFICATION",
        "REGRESSION",
        "REJECTED",
        "RESOLVED",
        "REVERIFICATION",
        "SUPERSEDED",
        "TRIAGED",
        "UNASSESSED",
        "UNDER_REMEDIATION",
        "UNKNOWN",
        "UNVERIFIED",
        "VALIDATED",
        "VERIFIED",
        "WAIVED"
      ]
    },
    "reason": {
      "type": "string",
      "minLength": 1
    },
    "evidence_refs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "string"
      },
      "uniqueItems": true
    },
    "actor": {
      "type": "string",
      "minLength": 1
    },
    "occurred_at": {
      "type": "string",
      "format": "date-time"
    },
    "sequence": {
      "type": "integer",
      "minimum": 0
    },
    "previous_transition": {
      "oneOf": [
        {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        },
        {
          "type": "null"
        }
      ]
    },
    "event_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "schema_version": {
      "const": "13.3"
    }
  },
  "additionalProperties": false,
  "x-v13.3-rules": [
    "Initial sequence is zero",
    "Hash excludes event_hash"
  ],
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.3/state-transition.schema.yaml"
}
