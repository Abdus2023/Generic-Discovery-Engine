{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "CurrentDecision",
  "type": "object",
  "required": [
    "current_decision_id",
    "audit_id",
    "requirement_id",
    "decision_id",
    "decision",
    "as_of",
    "implementation_snapshot",
    "specification_snapshot",
    "decision_history_valid",
    "schema_version",
    "projection_hash"
  ],
  "properties": {
    "current_decision_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "audit_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "requirement_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "decision_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "decision": {
      "type": "string",
      "enum": [
        "UNASSESSED",
        "MAPPED",
        "VERIFIED",
        "CONFORMANT",
        "PARTIALLY_CONFORMANT",
        "NON_CONFORMANT",
        "UNVERIFIED",
        "BLOCKED",
        "UNKNOWN",
        "NOT_APPLICABLE"
      ]
    },
    "as_of": {
      "type": "string",
      "format": "date-time"
    },
    "implementation_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "specification_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "decision_history_valid": {
      "const": true
    },
    "schema_version": {
      "const": "13.3"
    },
    "projection_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.3/current-decision.schema.yaml"
}
