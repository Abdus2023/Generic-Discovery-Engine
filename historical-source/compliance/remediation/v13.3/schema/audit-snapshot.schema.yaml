{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "AuditSnapshot",
  "type": "object",
  "required": [
    "snapshot_id",
    "audit_id",
    "specification_snapshot",
    "implementation_snapshot",
    "decision_snapshot",
    "waiver_snapshot",
    "state_history_snapshot",
    "scope_snapshot",
    "generated_at",
    "valid_for_aggregate",
    "schema_version",
    "snapshot_hash"
  ],
  "properties": {
    "snapshot_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "audit_id": {
      "type": "string",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    },
    "specification_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "implementation_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "decision_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "waiver_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "state_history_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "scope_snapshot": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "generated_at": {
      "type": "string",
      "format": "date-time"
    },
    "valid_for_aggregate": {
      "type": "boolean"
    },
    "schema_version": {
      "const": "13.3"
    },
    "snapshot_hash": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    }
  },
  "additionalProperties": false,
  "$id": "https://generic-discovery-engine.invalid/compliance/v13.3/audit-snapshot.schema.yaml"
}
