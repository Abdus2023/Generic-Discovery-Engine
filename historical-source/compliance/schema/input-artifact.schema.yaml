{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/input-artifact.schema.yaml",
  "title": "Protocol-v12.1 INPUT_ARTIFACT",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "artifact_type",
    "source_path",
    "content_hash",
    "producer_stage"
  ],
  "properties": {
    "object_type": {
      "const": "INPUT_ARTIFACT"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "artifact_type": {
      "type": "string",
      "enum": [
        "SPECIFICATION",
        "REQUIREMENT_SET",
        "NORMATIVE_RULE_SET",
        "ACCEPTANCE_CRITERIA",
        "TEST_ORACLES",
        "DEPENDENCIES",
        "CONFLICTS",
        "COMPATIBILITY",
        "IMPLEMENTATION_SOURCE",
        "TEST_SOURCE",
        "VERIFICATION_RECORD",
        "RUNTIME_ARTIFACT",
        "OTHER"
      ]
    },
    "source_path": {
      "type": "string"
    },
    "producer_stage": {
      "type": "string"
    },
    "schema_version_produced": {
      "type": "string"
    },
    "generated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "temporal_scope": {
      "$ref": "common.schema.yaml#/$defs/VersionScope"
    }
  },
  "additionalProperties": false,
  "x-v12.1-hash-rule": "content_hash covers the canonical object excluding content_hash"
}
