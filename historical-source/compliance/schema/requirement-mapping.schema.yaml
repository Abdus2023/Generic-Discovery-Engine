{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/requirement-mapping.schema.yaml",
  "title": "Protocol-v12.1 REQUIREMENT_MAPPING",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "requirement_id",
    "implementation_artifacts",
    "mapping_type",
    "coverage"
  ],
  "properties": {
    "object_type": {
      "const": "REQUIREMENT_MAPPING"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "requirement_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "implementation_artifacts": {
      "type": "array",
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      }
    },
    "mapping_type": {
      "type": "string",
      "enum": [
        "DIRECT",
        "INDIRECT",
        "DISTRIBUTED",
        "TEST_ONLY",
        "CONFIGURATION",
        "RUNTIME",
        "UNKNOWN"
      ]
    },
    "coverage": {
      "type": "string",
      "enum": [
        "FULL",
        "PARTIAL",
        "NONE",
        "UNKNOWN"
      ]
    },
    "rationale": {
      "type": [
        "string",
        "null"
      ]
    }
  },
  "additionalProperties": false
}
