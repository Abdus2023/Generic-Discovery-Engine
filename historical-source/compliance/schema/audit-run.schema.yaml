{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/audit-run.schema.yaml",
  "title": "Protocol-v12.1 AUDIT_RUN",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "audit_id",
    "inputs",
    "environment",
    "started_at",
    "status"
  ],
  "properties": {
    "object_type": {
      "const": "AUDIT_RUN"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "audit_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "inputs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      }
    },
    "environment": {
      "$ref": "common.schema.yaml#/$defs/Reference"
    },
    "started_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "completed_at": {
      "oneOf": [
        {
          "$ref": "common.schema.yaml#/$defs/Timestamp"
        },
        {
          "type": "null"
        }
      ]
    },
    "status": {
      "type": "string",
      "enum": [
        "RUNNING",
        "COMPLETED",
        "FAILED",
        "BLOCKED",
        "CANCELLED"
      ]
    },
    "result_hash": {
      "oneOf": [
        {
          "$ref": "common.schema.yaml#/$defs/Hash"
        },
        {
          "type": "null"
        }
      ]
    }
  },
  "additionalProperties": false
}
