{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v13/reverification-plan.schema.yaml",
  "title": "Protocol-v13 REVERIFICATION_PLAN",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "finding_id",
    "requirement_ids",
    "oracle_ids",
    "acceptance_criteria",
    "status"
  ],
  "properties": {
    "object_type": {
      "const": "REVERIFICATION_PLAN"
    },
    "schema_version": {
      "const": "13.0"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "finding_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "requirement_ids": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "oracle_ids": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "acceptance_criteria": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "negative_tests": {
      "type": "array",
      "items": {
        "$ref": "common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "regression_required": {
      "type": "boolean"
    },
    "status": {
      "type": "string",
      "enum": [
        "DRAFT",
        "APPROVED",
        "READY",
        "BLOCKED",
        "SUPERSEDED"
      ]
    }
  },
  "additionalProperties": false,
  "x-v13-constraints": [
    "Re-verification preserves original normative meaning"
  ]
}
