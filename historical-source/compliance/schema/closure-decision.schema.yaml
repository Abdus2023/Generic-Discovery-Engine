{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v13/closure-decision.schema.yaml",
  "title": "Protocol-v13 CLOSURE_DECISION",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "finding_id",
    "decision",
    "evidence",
    "decided_at"
  ],
  "properties": {
    "object_type": {
      "const": "CLOSURE_DECISION"
    },
    "schema_version": {
      "const": "13.0"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "finding_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "decision": {
      "type": "string",
      "enum": [
        "CLOSED",
        "PARTIALLY_RESOLVED",
        "REMAINS_OPEN",
        "WAIVED",
        "SUPERSEDED",
        "BLOCKED",
        "REJECTED"
      ]
    },
    "evidence": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      }
    },
    "residual_risk_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "decided_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "rationale": {
      "type": "string"
    }
  },
  "additionalProperties": false
}
