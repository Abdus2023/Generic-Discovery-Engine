{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/audit-scope.schema.yaml",
  "title": "Protocol-v12.1 AUDIT_SCOPE",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "target",
    "requirements",
    "temporal_policy"
  ],
  "properties": {
    "object_type": {
      "const": "AUDIT_SCOPE"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "target": {
      "type": "object",
      "required": [
        "implementation_version"
      ],
      "properties": {
        "implementation_version": {
          "type": "string"
        },
        "artifact_ids": {
          "type": "array",
          "items": {
            "$ref": "common.schema.yaml#/$defs/Identifier"
          },
          "uniqueItems": true
        }
      }
    },
    "requirements": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      },
      "uniqueItems": true
    },
    "exclusions": {
      "type": "array",
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      },
      "uniqueItems": true
    },
    "temporal_policy": {
      "type": "string",
      "enum": [
        "VERSION_BOUND",
        "CURRENT",
        "RETROSPECTIVE"
      ]
    },
    "historical_version": {
      "type": [
        "string",
        "null"
      ]
    }
  },
  "additionalProperties": false,
  "x-v12.1-constraint": "HISTORICAL audits use VERSION_BOUND or explicitly RETROSPECTIVE"
}
