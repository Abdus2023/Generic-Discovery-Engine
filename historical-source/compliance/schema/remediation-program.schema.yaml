{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v13/remediation-program.schema.yaml",
  "title": "Protocol-v13 REMEDIATION_PROGRAM",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "program_id",
    "finding_ids",
    "status"
  ],
  "properties": {
    "object_type": {
      "const": "REMEDIATION_PROGRAM"
    },
    "schema_version": {
      "const": "13.0"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "program_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "finding_ids": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Identifier"
      },
      "uniqueItems": true
    },
    "status": {
      "type": "string",
      "enum": [
        "OPEN",
        "TRIAGED",
        "ROOT_CAUSED",
        "PLANNED",
        "IN_PROGRESS",
        "READY_FOR_VERIFICATION",
        "VERIFIED",
        "CLOSED",
        "BLOCKED",
        "REJECTED",
        "SUPERSEDED"
      ]
    },
    "priority": {
      "type": "string",
      "enum": [
        "CRITICAL",
        "HIGH",
        "MEDIUM",
        "LOW",
        "UNKNOWN"
      ]
    },
    "owner": {
      "type": [
        "string",
        "null"
      ]
    },
    "closed_at": {
      "oneOf": [
        {
          "$ref": "common.schema.yaml#/$defs/Timestamp"
        },
        {
          "type": "null"
        }
      ]
    }
  },
  "additionalProperties": false
}
