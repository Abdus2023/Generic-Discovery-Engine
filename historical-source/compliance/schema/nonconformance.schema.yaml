{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/nonconformance.schema.yaml",
  "title": "Protocol-v12.1 NONCONFORMANCE",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "requirement_id",
    "violated_condition",
    "evidence",
    "severity"
  ],
  "properties": {
    "object_type": {
      "const": "NONCONFORMANCE"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "requirement_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "violated_condition": {
      "type": "string"
    },
    "violated_rule": {
      "type": "string"
    },
    "evidence": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "common.schema.yaml#/$defs/Reference"
      }
    },
    "severity": {
      "type": "string",
      "enum": [
        "CRITICAL",
        "HIGH",
        "MEDIUM",
        "LOW",
        "INFO",
        "UNKNOWN"
      ]
    },
    "reproducibility": {
      "type": "string",
      "enum": [
        "REPRODUCIBLE",
        "FLAKY",
        "NON_REPRODUCIBLE",
        "UNKNOWN"
      ]
    }
  },
  "additionalProperties": false,
  "x-v12.1-constraint": "A nonconformance identifies the normative condition actually violated"
}
