{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://generic-discovery-engine.invalid/compliance/v12.1/waiver.schema.yaml",
  "title": "Protocol-v12.1 WAIVER",
  "type": "object",
  "required": [
    "object_type",
    "schema_version",
    "object_id",
    "created_at",
    "requirement_id",
    "justification",
    "scope",
    "authority",
    "status"
  ],
  "properties": {
    "object_type": {
      "const": "WAIVER"
    },
    "schema_version": {
      "const": "12.1"
    },
    "object_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "created_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "updated_at": {
      "$ref": "common.schema.yaml#/$defs/Timestamp"
    },
    "producer": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "content_hash": {
      "$ref": "common.schema.yaml#/$defs/Hash"
    },
    "metadata": {
      "type": "object"
    },
    "requirement_id": {
      "$ref": "common.schema.yaml#/$defs/Identifier"
    },
    "justification": {
      "type": "string",
      "minLength": 1
    },
    "scope": {
      "type": "object"
    },
    "authority": {
      "type": "string"
    },
    "status": {
      "type": "string",
      "enum": [
        "PROPOSED",
        "APPROVED",
        "REJECTED",
        "EXPIRED",
        "REVOKED"
      ]
    },
    "expires_at": {
      "oneOf": [
        {
          "$ref": "common.schema.yaml#/$defs/Timestamp"
        },
        {
          "type": "null"
        }
      ]
    }
  },
  "additionalProperties": false,
  "x-v12.1-constraint": "A waiver changes disposition, never requirement truth"
}
