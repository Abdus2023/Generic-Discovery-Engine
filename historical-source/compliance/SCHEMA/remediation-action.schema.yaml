{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 remediation action",
  "type": "object",
  "required": [
    "action_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "description",
    "implementation_boundary",
    "affected_artifacts",
    "expected_effect",
    "verification"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "action_id": {
      "type": "string",
      "minLength": 1
    },
    "description": {
      "type": "string",
      "minLength": 1
    },
    "implementation_boundary": {
      "type": "array"
    },
    "affected_artifacts": {
      "type": "array"
    },
    "expected_effect": {
      "type": "object"
    },
    "verification": {
      "type": "object"
    }
  },
  "additionalProperties": true
}
