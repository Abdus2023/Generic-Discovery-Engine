{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 waiver",
  "type": "object",
  "required": [
    "waiver_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirement_id",
    "reason",
    "scope",
    "approved_by",
    "approved_at",
    "expires_at",
    "conditions",
    "residual_risk",
    "status"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "waiver_id": {
      "type": "string",
      "minLength": 1
    },
    "requirement_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "reason": {
      "type": "string",
      "minLength": 1
    },
    "scope": {
      "type": "object"
    },
    "approved_by": {
      "type": "string",
      "minLength": 1
    },
    "approved_at": {
      "type": "string",
      "minLength": 1
    },
    "expires_at": {
      "type": [
        "string",
        "null"
      ]
    },
    "conditions": {
      "type": "array"
    },
    "residual_risk": {
      "type": "string",
      "minLength": 1
    },
    "status": {
      "enum": [
        "ACTIVE",
        "EXPIRED",
        "REVOKED",
        "PENDING",
        "REJECTED"
      ]
    }
  },
  "additionalProperties": true
}
