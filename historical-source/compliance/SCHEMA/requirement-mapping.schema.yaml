{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 requirement mapping",
  "type": "object",
  "required": [
    "mapping_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirement_id",
    "implementation_artifacts",
    "mapping_type",
    "coverage",
    "rationale"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "mapping_id": {
      "type": "string",
      "minLength": 1
    },
    "requirement_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "implementation_artifacts": {
      "type": "array"
    },
    "mapping_type": {
      "enum": [
        "DIRECT",
        "INDIRECT",
        "DISTRIBUTED",
        "TEST_ONLY",
        "CONFIGURATION",
        "RUNTIME",
        "UNKNOWN"
      ]
    },
    "coverage": {
      "enum": [
        "FULL",
        "PARTIAL",
        "NONE",
        "UNKNOWN"
      ]
    },
    "rationale": {
      "type": "string",
      "minLength": 1
    }
  },
  "additionalProperties": true
}
