{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 evidence record",
  "type": "object",
  "required": [
    "evidence_record_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "source_type",
    "source_ref",
    "requirement_id",
    "criterion_id",
    "oracle_id",
    "observation",
    "expected",
    "result",
    "timestamp",
    "environment",
    "content_hash"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "evidence_record_id": {
      "type": "string",
      "minLength": 1
    },
    "source_type": {
      "type": "string",
      "minLength": 1
    },
    "source_ref": {
      "type": "string",
      "minLength": 1
    },
    "requirement_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "criterion_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "oracle_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "observation": {
      "type": "string",
      "minLength": 1
    },
    "expected": {
      "type": "string",
      "minLength": 1
    },
    "result": {
      "enum": [
        "PASS",
        "FAIL",
        "INCONCLUSIVE",
        "UNAVAILABLE",
        "INVALID",
        "UNKNOWN"
      ]
    },
    "timestamp": {
      "type": "string",
      "minLength": 1
    },
    "environment": {
      "type": "string",
      "minLength": 1
    },
    "content_hash": {
      "type": [
        "string",
        "null"
      ]
    }
  },
  "additionalProperties": true
}
