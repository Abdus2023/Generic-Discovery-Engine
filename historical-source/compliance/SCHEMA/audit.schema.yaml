{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 audit",
  "type": "object",
  "required": [
    "audit_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "audit_version",
    "specification_id",
    "implementation_id",
    "scope",
    "mode",
    "started_at",
    "completed_at",
    "requirements",
    "findings",
    "decisions",
    "certificate_id"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "audit_id": {
      "type": "string",
      "minLength": 1
    },
    "audit_version": {
      "type": "string",
      "minLength": 1
    },
    "specification_id": {
      "type": "string",
      "minLength": 1
    },
    "implementation_id": {
      "type": "string",
      "minLength": 1
    },
    "scope": {
      "type": "object"
    },
    "mode": {
      "enum": [
        "FULL",
        "TARGETED",
        "REGRESSION",
        "SECURITY",
        "COMPATIBILITY",
        "RELEASE",
        "HISTORICAL",
        "EXPERIMENTAL"
      ]
    },
    "started_at": {
      "type": "string",
      "minLength": 1
    },
    "completed_at": {
      "type": "string",
      "minLength": 1
    },
    "requirements": {
      "type": "array"
    },
    "findings": {
      "type": "array"
    },
    "decisions": {
      "type": "array"
    },
    "certificate_id": {
      "type": "string",
      "minLength": 1
    }
  },
  "additionalProperties": true
}
