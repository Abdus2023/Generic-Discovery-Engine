{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 remediation",
  "type": "object",
  "required": [
    "remediation_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "finding_id",
    "description",
    "target_requirements",
    "actions",
    "priority",
    "owner",
    "status",
    "verification"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "remediation_id": {
      "type": "string",
      "minLength": 1
    },
    "finding_id": {
      "type": "string",
      "minLength": 1
    },
    "description": {
      "type": "string",
      "minLength": 1
    },
    "target_requirements": {
      "type": "array"
    },
    "actions": {
      "type": "array"
    },
    "priority": {
      "enum": [
        "CRITICAL",
        "HIGH",
        "MEDIUM",
        "LOW"
      ]
    },
    "owner": {
      "type": [
        "string",
        "null"
      ]
    },
    "status": {
      "enum": [
        "OPEN",
        "PLANNED",
        "IN_PROGRESS",
        "BLOCKED",
        "COMPLETED",
        "VERIFIED",
        "REJECTED"
      ]
    },
    "verification": {
      "type": "object"
    }
  },
  "additionalProperties": true
}
