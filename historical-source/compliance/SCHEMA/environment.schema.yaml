{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 environment",
  "type": "object",
  "required": [
    "environment_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "runtime",
    "runtime_version",
    "platform",
    "platform_version",
    "dependencies",
    "configuration_hash",
    "network_mode",
    "storage_mode",
    "constraints"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "environment_id": {
      "type": "string",
      "minLength": 1
    },
    "runtime": {
      "type": "string",
      "minLength": 1
    },
    "runtime_version": {
      "type": "string",
      "minLength": 1
    },
    "platform": {
      "type": "string",
      "minLength": 1
    },
    "platform_version": {
      "type": "string",
      "minLength": 1
    },
    "dependencies": {
      "type": "array"
    },
    "configuration_hash": {
      "type": "string",
      "minLength": 1
    },
    "network_mode": {
      "enum": [
        "ONLINE",
        "OFFLINE",
        "RESTRICTED",
        "MOCKED",
        "UNKNOWN"
      ]
    },
    "storage_mode": {
      "enum": [
        "PERSISTENT",
        "EPHEMERAL",
        "MOCKED",
        "READ_ONLY",
        "UNKNOWN"
      ]
    },
    "constraints": {
      "type": "array"
    }
  },
  "additionalProperties": true
}
