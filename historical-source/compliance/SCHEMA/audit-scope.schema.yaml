{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 audit scope",
  "type": "object",
  "required": [
    "scope_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirements",
    "exclusions",
    "components",
    "versions",
    "environments",
    "constraints",
    "status"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "requirements": {
      "type": "object"
    },
    "exclusions": {
      "type": "array"
    },
    "components": {
      "type": "array"
    },
    "versions": {
      "type": "array"
    },
    "environments": {
      "type": "array"
    },
    "constraints": {
      "type": "array"
    },
    "status": {
      "type": "string",
      "minLength": 1
    }
  },
  "additionalProperties": true
}
