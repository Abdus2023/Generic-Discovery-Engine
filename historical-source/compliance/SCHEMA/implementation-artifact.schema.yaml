{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 implementation artifact",
  "type": "object",
  "required": [
    "artifact_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "artifact_type",
    "path",
    "symbol",
    "version",
    "content_hash",
    "language",
    "component",
    "source_location"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "artifact_id": {
      "type": "string",
      "minLength": 1
    },
    "artifact_type": {
      "enum": [
        "SOURCE_FILE",
        "FUNCTION",
        "METHOD",
        "TYPE",
        "TRAIT",
        "MODULE",
        "CONFIGURATION",
        "SCHEMA",
        "TEST",
        "FIXTURE",
        "DOCUMENTATION",
        "BUILD_ARTIFACT",
        "BINARY",
        "RUNTIME_TRACE",
        "LOG",
        "METRIC",
        "AUDIT_RECORD"
      ]
    },
    "path": {
      "type": "string",
      "minLength": 1
    },
    "symbol": {
      "type": [
        "string",
        "null"
      ]
    },
    "version": {
      "type": [
        "string",
        "null"
      ]
    },
    "content_hash": {
      "type": [
        "string",
        "null"
      ]
    },
    "language": {
      "type": [
        "string",
        "null"
      ]
    },
    "component": {
      "type": "string",
      "minLength": 1
    },
    "source_location": {
      "type": "object"
    }
  },
  "additionalProperties": true
}
