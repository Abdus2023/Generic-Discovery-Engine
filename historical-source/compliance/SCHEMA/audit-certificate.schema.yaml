{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 audit certificate",
  "type": "object",
  "required": [
    "certificate_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "audit_id",
    "specification_hash",
    "implementation_hash",
    "status",
    "counts",
    "critical_findings",
    "waivers",
    "temporal_integrity",
    "traceability_integrity",
    "verification_integrity",
    "scope_id",
    "generated_at",
    "limitations",
    "certificate_hash"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "certificate_id": {
      "type": "string",
      "minLength": 1
    },
    "audit_id": {
      "type": "string",
      "minLength": 1
    },
    "specification_hash": {
      "type": "string",
      "minLength": 1
    },
    "implementation_hash": {
      "type": "string",
      "minLength": 1
    },
    "status": {
      "enum": [
        "COMPLIANT",
        "CONDITIONALLY_COMPLIANT",
        "NON_COMPLIANT",
        "UNVERIFIED",
        "BLOCKED"
      ]
    },
    "counts": {
      "type": "object"
    },
    "critical_findings": {
      "type": "integer",
      "minimum": 0
    },
    "waivers": {
      "type": "integer",
      "minimum": 0
    },
    "temporal_integrity": {
      "type": "string",
      "minLength": 1
    },
    "traceability_integrity": {
      "type": "string",
      "minLength": 1
    },
    "verification_integrity": {
      "type": "string",
      "minLength": 1
    },
    "scope_id": {
      "type": "string",
      "minLength": 1
    },
    "generated_at": {
      "type": "string",
      "minLength": 1
    },
    "limitations": {
      "type": "array"
    },
    "certificate_hash": {
      "type": "string",
      "minLength": 1
    }
  },
  "additionalProperties": true
}
