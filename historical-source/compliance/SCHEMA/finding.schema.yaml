{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "title": "v12 finding",
  "type": "object",
  "required": [
    "finding_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirement_id",
    "finding_type",
    "severity",
    "title",
    "description",
    "evidence",
    "impact",
    "status"
  ],
  "properties": {
    "object_type": {
      "type": "string",
      "minLength": 1
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "PLANNED",
        "RUNNING",
        "COMPLETED",
        "BLOCKED",
        "FAILED",
        "VERIFIED",
        "REJECTED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object",
      "required": [
        "source_artifact",
        "content_hash",
        "audit_interpretation"
      ],
      "properties": {
        "source_artifact": {
          "type": "string",
          "minLength": 1
        },
        "content_hash": {
          "type": "string",
          "minLength": 1
        },
        "audit_interpretation": {
          "type": "string",
          "minLength": 1
        }
      },
      "additionalProperties": false
    },
    "finding_id": {
      "type": "string",
      "minLength": 1
    },
    "requirement_id": {
      "type": [
        "string",
        "null"
      ]
    },
    "finding_type": {
      "enum": [
        "NON_CONFORMANCE",
        "SPECIFICATION_DEFECT",
        "VERIFICATION_DEFECT",
        "ORACLE_DEFECT",
        "MAPPING_DEFECT",
        "TRACEABILITY_GAP",
        "SECURITY_RISK",
        "COMPATIBILITY_RISK",
        "RESOURCE_RISK",
        "PROCESS_FAILURE",
        "UNKNOWN"
      ]
    },
    "severity": {
      "enum": [
        "CRITICAL",
        "HIGH",
        "MEDIUM",
        "LOW",
        "INFO",
        "UNKNOWN"
      ]
    },
    "title": {
      "type": "string",
      "minLength": 1
    },
    "description": {
      "type": "string",
      "minLength": 1
    },
    "evidence": {
      "type": "array"
    },
    "impact": {
      "type": "string",
      "minLength": 1
    },
    "status": {
      "type": "string",
      "minLength": 1
    }
  },
  "additionalProperties": true
}
