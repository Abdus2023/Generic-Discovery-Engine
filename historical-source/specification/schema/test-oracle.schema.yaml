{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "additionalProperties": true,
  "title": "Protocol-v11 test oracle",
  "type": "object",
  "required": [
    "oracle_id",
    "criterion_id",
    "oracle_type",
    "input_contract",
    "observation",
    "expected_predicate",
    "tolerance",
    "failure_class",
    "evidence_capture"
  ],
  "properties": {
    "oracle_type": {
      "enum": [
        "BOOLEAN",
        "EXACT_VALUE",
        "RANGE",
        "SET_MEMBERSHIP",
        "STRUCTURAL",
        "STATE",
        "TRACE",
        "INVARIANT",
        "PROPERTY",
        "REFERENCE_MODEL",
        "DIFFERENTIAL",
        "METAMORPHIC",
        "HASH",
        "SIGNATURE",
        "SCHEMA",
        "TEMPORAL",
        "RESOURCE_BOUND",
        "SECURITY_POLICY"
      ]
    }
  }
}
