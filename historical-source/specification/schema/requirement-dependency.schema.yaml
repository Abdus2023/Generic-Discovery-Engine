{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "additionalProperties": true,
  "title": "Protocol-v11 requirement dependency",
  "type": "object",
  "required": [
    "dependency_id",
    "from_requirement",
    "to_requirement",
    "relation",
    "condition",
    "reason",
    "evidence"
  ],
  "properties": {
    "relation": {
      "enum": [
        "REQUIRES",
        "ENABLES",
        "SUPPORTS",
        "REFINES",
        "STRENGTHENS",
        "CONSTRAINS",
        "CONFLICTS_WITH",
        "SUPERSEDES",
        "VERIFIED_BY",
        "DERIVED_FROM"
      ]
    }
  }
}
