{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "additionalProperties": true,
  "title": "Protocol-v11 specification certificate",
  "type": "object",
  "required": [
    "specification_version",
    "generated_at",
    "input_hashes",
    "requirement_count",
    "rule_count",
    "criterion_count",
    "oracle_count",
    "conflict_count",
    "orphan_requirement_count",
    "orphan_obligation_count",
    "coverage",
    "validation_status",
    "unresolved_issues",
    "certificate_hash"
  ],
  "properties": {
    "validation_status": {
      "enum": [
        "PASS",
        "FAIL",
        "PARTIAL"
      ]
    }
  }
}
