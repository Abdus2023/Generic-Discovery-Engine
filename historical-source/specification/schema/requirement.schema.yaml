{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "additionalProperties": true,
  "title": "Protocol-v11 requirement",
  "type": "object",
  "required": [
    "requirement_id",
    "requirement_version",
    "statement",
    "requirement_type",
    "disposition",
    "strength",
    "final_category",
    "epistemic_status",
    "lifecycle_status",
    "scope",
    "conformance_level",
    "criticality",
    "source_obligations",
    "source_properties",
    "source_evidence",
    "derivation",
    "preconditions",
    "postconditions",
    "normative_rules",
    "acceptance_criteria",
    "test_oracles",
    "invariants",
    "transitions",
    "dependencies",
    "conflicts",
    "compatibility",
    "implementation_boundary",
    "boundary_model",
    "exceptions",
    "assumptions",
    "verification"
  ],
  "properties": {
    "requirement_version": {
      "const": "1.0"
    },
    "requirement_type": {
      "enum": [
        "BEHAVIORAL",
        "STRUCTURAL",
        "INTERFACE",
        "SEMANTIC",
        "STATE",
        "LIFECYCLE",
        "ERROR",
        "SECURITY",
        "AUTHORIZATION",
        "CONCURRENCY",
        "RESOURCE",
        "PERFORMANCE",
        "PERSISTENCE",
        "PROVENANCE",
        "OBSERVABILITY",
        "COMPATIBILITY",
        "CONFIGURATION",
        "SERIALIZATION",
        "DISCOVERY",
        "DEDUPLICATION",
        "SCHEDULING",
        "CANCELLATION",
        "RECOVERY",
        "AUDIT",
        "EXPORT",
        "UI",
        "TESTABILITY",
        "VERIFICATION",
        "NEGATIVE",
        "INVARIANT",
        "TRANSITION",
        "BOUNDARY"
      ]
    },
    "disposition": {
      "enum": [
        "PRESERVE",
        "STABILIZE",
        "GENERALIZE",
        "FORMALIZE",
        "STRENGTHEN",
        "RESTRICT",
        "COMPATIBILIZE",
        "DEPRECATE",
        "REJECT",
        "INTRODUCE",
        "OPTIONALIZE"
      ]
    },
    "strength": {
      "enum": [
        "MANDATORY",
        "CONDITIONAL",
        "RECOMMENDED",
        "OPTIONAL",
        "EXPERIMENTAL",
        "NON_NORMATIVE",
        "UNKNOWN"
      ]
    },
    "final_category": {
      "enum": [
        "PRESERVATION_OBLIGATION",
        "COMPATIBILITY_OBLIGATION",
        "ENGINEERING_REQUIREMENT",
        "FUTURE_STRENGTHENING",
        "DESIGN_OPTION",
        "HISTORICAL_DEFECT",
        "UNKNOWN"
      ]
    },
    "epistemic_status": {
      "enum": [
        "PROVED",
        "SUPPORTED",
        "INFERRED",
        "CONJECTURED",
        "CONTRADICTED",
        "UNKNOWN"
      ]
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "conformance_level": {
      "enum": [
        "L0_NONE",
        "L1_STRUCTURAL",
        "L2_BEHAVIORAL",
        "L3_SEMANTIC",
        "L4_SAFETY",
        "L5_SECURITY",
        "L6_VERIFIED"
      ]
    },
    "criticality": {
      "enum": [
        "CRITICAL",
        "HIGH",
        "MEDIUM",
        "LOW",
        "UNKNOWN"
      ]
    },
    "scope": {
      "type": "object",
      "required": [
        "scope_type",
        "scope_ref"
      ],
      "properties": {
        "scope_type": {
          "enum": [
            "GLOBAL",
            "VERSION",
            "COMPONENT",
            "INTERFACE",
            "OPERATION",
            "STATE",
            "TRANSITION",
            "CANDIDATE",
            "OBSERVATION",
            "DISCOVERY",
            "PROVIDER",
            "SCHEDULER",
            "WORKER",
            "KNOWLEDGE_BASE",
            "PERSISTENCE",
            "EXPORT",
            "UI",
            "TEST",
            "SECURITY_BOUNDARY",
            "TRUST_BOUNDARY",
            "CONFIGURATION",
            "RUNTIME"
          ]
        }
      }
    },
    "verification": {
      "type": "object",
      "required": [
        "verification_level",
        "evidence",
        "result"
      ],
      "properties": {
        "verification_level": {
          "enum": [
            "V0_UNTESTED",
            "V1_EXAMPLE_TESTED",
            "V2_UNIT_VERIFIED",
            "V3_PROPERTY_VERIFIED",
            "V4_INTEGRATION_VERIFIED",
            "V5_ADVERSARIAL_VERIFIED",
            "V6_FORMALLY_VERIFIED"
          ]
        }
      }
    }
  }
}
