{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 implementation boundary",
  "type": "object",
  "required": [
    "boundary_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "boundary_type",
    "name",
    "enforces",
    "observes",
    "verifies",
    "authority",
    "trust_level"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "boundary_type": {
      "enum": [
        "INPUT",
        "VALIDATION",
        "ACQUISITION",
        "RECOGNITION",
        "PROVIDER",
        "EXPANSION",
        "SCHEDULER",
        "STATE_STORE",
        "KNOWLEDGE_BASE",
        "PERSISTENCE",
        "AUTHORIZATION",
        "AUDIT",
        "EXPORT",
        "UI",
        "RUNTIME",
        "TEST_HARNESS"
      ]
    }
  },
  "additionalProperties": true
}
