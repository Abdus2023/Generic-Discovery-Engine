{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 acceptance criterion",
  "type": "object",
  "required": [
    "criterion_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirement_id",
    "statement",
    "preconditions",
    "observation",
    "expected",
    "pass_condition",
    "fail_condition",
    "evidence_required",
    "environment",
    "oracle_ids"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    }
  },
  "additionalProperties": true
}
