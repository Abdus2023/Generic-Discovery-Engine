{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 requirement",
  "type": "object",
  "required": [
    "requirement_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "statement",
    "requirement_type",
    "disposition",
    "strength",
    "epistemic_status",
    "scope",
    "source_obligations",
    "source_properties",
    "source_evidence",
    "rationales",
    "rules",
    "acceptance_criteria",
    "invariants",
    "transitions",
    "dependencies",
    "conflicts",
    "guidance",
    "implementation_notes",
    "examples",
    "assumptions",
    "implementation_boundaries",
    "exceptions",
    "compatibility"
