  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "requirement_type": {
      "enum": [
        "BEHAVIORAL",
        "STRUCTURAL",
        "INTERFACE",
        "SEMANTIC",
        "STATE",
        "LIFECYCLE",
        "ERROR",
        "SECURITY",
        "AUTHORIZATION",
        "CONCURRENCY",
        "RESOURCE",
        "PERFORMANCE",
        "PERSISTENCE",
        "PROVENANCE",
        "OBSERVABILITY",
        "COMPATIBILITY",
        "CONFIGURATION",
        "SERIALIZATION",
        "DISCOVERY",
        "DEDUPLICATION",
        "SCHEDULING",
        "CANCELLATION",
        "RECOVERY",
        "AUDIT",
        "EXPORT",
        "UI",
        "TESTABILITY",
        "VERIFICATION",
        "NEGATIVE",
        "INVARIANT",
        "TRANSITION",
        "BOUNDARY"
      ]
    },
    "disposition": {
      "enum": [
        "PRESERVE",
        "STABILIZE",
        "GENERALIZE",
        "FORMALIZE",
        "STRENGTHEN",
        "RESTRICT",
        "COMPATIBILIZE",
        "DEPRECATE",
        "REJECT",
        "INTRODUCE",
        "OPTIONALIZE"
      ]
    },
    "strength": {
      "enum": [
        "MANDATORY",
        "CONDITIONAL",
        "RECOMMENDED",
        "OPTIONAL",
        "EXPERIMENTAL",
        "NON_NORMATIVE",
        "UNKNOWN"
      ]
    },
    "epistemic_status": {
      "enum": [
        "PROVED",
        "SUPPORTED",
        "INFERRED",
        "CONJECTURED",
        "CONTRADICTED",
        "UNKNOWN"
      ]
    },
    "scope": {
      "type": "object",
      "required": [
        "type",
        "ref"
      ],
      "properties": {
        "type": {
          "enum": [
            "GLOBAL",
            "VERSION",
            "COMPONENT",
            "INTERFACE",
            "OPERATION",
            "STATE",
            "TRANSITION",
            "CANDIDATE",
            "OBSERVATION",
            "DISCOVERY",
            "PROVIDER",
            "SCHEDULER",
            "WORKER",
            "KNOWLEDGE_BASE",
            "PERSISTENCE",
            "EXPORT",
            "UI",
            "TEST",
            "SECURITY_BOUNDARY",
            "TRUST_BOUNDARY",
            "CONFIGURATION",
            "RUNTIME"
          ]
        }
      }
    }
  },
  "additionalProperties": true
}
