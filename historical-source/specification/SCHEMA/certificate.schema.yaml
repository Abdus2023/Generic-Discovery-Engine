{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 specification certificate",
  "type": "object",
  "required": [
    "certificate_hash",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "specification_version",
    "validation_status",
    "counts",
    "coverage",
    "failures",
    "warnings",
    "input_hashes",
    "certificate_semantics"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "validation_status": {
      "enum": [
        "PASS",
        "PARTIAL",
        "FAIL"
      ]
    }
  },
  "additionalProperties": true
}
