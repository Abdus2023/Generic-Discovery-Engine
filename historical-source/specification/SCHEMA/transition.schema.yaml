{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 transition",
  "type": "object",
  "required": [
    "transition_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "from_state",
    "event",
    "guard",
    "to_state",
    "required_effects",
    "forbidden_effects",
    "failure_behavior",
    "verification"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    }
  },
  "additionalProperties": true
}
