{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 test result",
  "type": "object",
  "required": [
    "test_result_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "requirement_id",
    "criterion_id",
    "oracle_id",
    "execution_id",
    "result",
    "observed",
    "expected",
    "evidence",
    "environment",
    "timestamp",
    "failure"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "result": {
      "enum": [
        "PASS",
        "FAIL",
        "BLOCKED",
        "SKIPPED",
        "INCONCLUSIVE",
        "NOT_APPLICABLE",
        "UNKNOWN"
      ]
    }
  },
  "additionalProperties": true
}
