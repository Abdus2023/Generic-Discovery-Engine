{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 test oracle",
  "type": "object",
  "required": [
    "oracle_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "criterion_id",
    "oracle_type",
    "input_contract",
    "observation",
    "expected_predicate",
    "comparison",
    "failure_class",
    "independence",
    "evidence_capture"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "oracle_type": {
      "enum": [
        "BOOLEAN",
        "EXACT_VALUE",
        "RANGE",
        "SET_MEMBERSHIP",
        "STRUCTURAL",
        "STATE",
        "TRACE",
        "INVARIANT",
        "PROPERTY",
        "REFERENCE_MODEL",
        "DIFFERENTIAL",
        "METAMORPHIC",
        "HASH",
        "SIGNATURE",
        "SCHEMA",
        "TEMPORAL",
        "RESOURCE_BOUND",
        "SECURITY_POLICY"
      ]
    }
  },
  "additionalProperties": true
}
