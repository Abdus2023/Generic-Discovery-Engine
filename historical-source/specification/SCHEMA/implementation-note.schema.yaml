{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 implementation note",
  "type": "object",
  "required": [
    "implementation_note_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "statement",
    "related_requirements",
    "related_boundaries",
    "status",
    "technology",
    "constraints",
    "epistemic_status"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "status": {
      "enum": [
        "SUGGESTED",
        "EXAMPLE",
        "EXPERIMENTAL",
        "CURRENT",
        "DEPRECATED",
        "UNKNOWN"
      ]
    }
  },
  "additionalProperties": true
}
