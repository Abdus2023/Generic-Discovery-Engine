{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "schema_version": "1.0",
  "schema_change_class": "MAJOR",
  "title": "v11.1 exception",
  "type": "object",
  "required": [
    "exception_id",
    "object_type",
    "schema_version",
    "lifecycle_status",
    "provenance",
    "applies_to",
    "condition",
    "altered_behavior",
    "security_impact",
    "audit_required",
    "justification"
  ],
  "properties": {
    "object_type": {
      "type": "string"
    },
    "schema_version": {
      "const": "1.0"
    },
    "lifecycle_status": {
      "enum": [
        "DISCOVERED",
        "DERIVED",
        "DRAFTED",
        "FORMALIZED",
        "IMPLEMENTED",
        "PARTIALLY_IMPLEMENTED",
        "VERIFIED",
        "FAILED",
        "SUPERSEDED",
        "REJECTED",
        "DEPRECATED",
        "UNKNOWN"
      ]
    },
    "provenance": {
      "type": "object"
    },
    "security_impact": {
      "enum": [
        "NONE",
        "LOW",
        "MEDIUM",
        "HIGH",
        "CRITICAL",
        "UNKNOWN"
      ]
    }
  },
  "additionalProperties": true
}
